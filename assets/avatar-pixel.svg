<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Pixel art style avatar -->
  <g shape-rendering="crispEdges">
    <!-- Hair -->
    <rect x="140" y="80" width="120" height="40" fill="#18181b"/>
    <rect x="120" y="100" width="30" height="80" fill="#18181b"/>
    <rect x="250" y="100" width="30" height="80" fill="#18181b"/>
    <rect x="130" y="60" width="140" height="30" fill="#27272a"/>
    <!-- Face skin -->
    <rect x="140" y="120" width="120" height="110" fill="#fbcfe8"/>
    <rect x="130" y="140" width="10" height="50" fill="#fbcfe8"/>
    <rect x="260" y="140" width="10" height="50" fill="#fbcfe8"/>
    <!-- Eyes -->
    <rect x="160" y="150" width="20" height="20" fill="#18181b"/>
    <rect x="220" y="150" width="20" height="20" fill="#18181b"/>
    <rect x="170" y="150" width="10" height="10" fill="#ffffff"/>
    <rect x="230" y="150" width="10" height="10" fill="#ffffff"/>
    <!-- Blush -->
    <rect x="150" y="180" width="20" height="10" fill="#f472b6" opacity="0.6"/>
    <rect x="230" y="180" width="20" height="10" fill="#f472b6" opacity="0.6"/>
    <!-- Smile -->
    <rect x="180" y="200" width="40" height="10" fill="#be185d"/>
    <!-- Glasses -->
    <rect x="150" y="140" width="40" height="35" fill="none" stroke="#0284c7" stroke-width="6"/>
    <rect x="210" y="140" width="40" height="35" fill="none" stroke="#0284c7" stroke-width="6"/>
    <rect x="190" y="150" width="20" height="6" fill="#0284c7"/>
    <!-- Neck -->
    <rect x="180" y="230" width="40" height="30" fill="#f9a8d4"/>
    <!-- Hoodie / Academy Jacket -->
    <rect x="110" y="260" width="180" height="140" fill="#0284c7"/>
    <rect x="90" y="290" width="30" height="110" fill="#0369a1"/>
    <rect x="280" y="290" width="30" height="110" fill="#0369a1"/>
    <rect x="170" y="260" width="60" height="40" fill="#e0f2fe"/>
    <!-- Apple logo hint -->
    <rect x="190" y="310" width="20" height="24" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>